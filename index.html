<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Portfolio" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="color-scheme" content="only light dark">
  <meta name="theme-color" id="theme-meta" content="#0a0a0a" />
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    const color = savedTheme === 'dark' ? '#0a0a0a' : '#fafafa';

    document.documentElement.classList.add(savedTheme);
    document.getElementById('theme-meta').setAttribute('content', color);
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <title>Florent Deborde | Full-Stack Developer</title>
  <meta name="description"
    content="Florent Deborde's Portfolio, a Full-Stack developer passionate about creating modern, high-performance, and intuitive web applications. Learn more about my projects and skills." />
  <meta name="keywords"
    content="Florent Deborde, Full-Stack Developer, React, Spring Boot, Portfolio, Web Development" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://florentdeborde.fr/" />
  <meta property="og:title" content="Florent Deborde | Full-Stack Developer" />
  <meta property="og:description" content="Discover my portfolio and achievements as a Full-Stack developer." />
  <meta property="og:image" content="https://florentdeborde.fr/og-image.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://florentdeborde.fr/" />
  <meta name="twitter:title" content="Florent Deborde | Full-Stack Developer" />
  <meta name="twitter:description" content="Discover my portfolio and achievements as a Full-Stack developer." />
  <meta name="twitter:image" content="https://florentdeborde.fr/og-image.png" />
</head>
